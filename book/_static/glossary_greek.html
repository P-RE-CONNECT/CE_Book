<!DOCTYPE html>
<html>
<head>
  <style>
    .glossary-controls {
      display: flex;
      gap: 2em;
      align-items: flex-start;
      margin-bottom: 1em;
    }
    .glossary-control-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 200px;
    }
    .glossary-control-group label {
      margin-bottom: 0.5em;
      font-weight: bold;
    }
    #course-select {
      width: 300px;
      min-width: 180px;
      max-width: 100%;
      height: 18em;
      box-sizing: border-box;
    }
    #search-bar {
      width: 300px;
      min-width: 180px;
      max-width: 100%;
      height: 2.4em;
      box-sizing: border-box;
    }
    #clear-search {
      font-size: 1.2em;
      line-height: 1em;
      padding: 0.1em 0.6em;
      border: none;
      background: #eee;
      cursor: pointer;
      border-radius: 3px;
      margin-left: -2.4em;
    }
    #clear-search:hover {
      background: #ddd;
    }
    .export-buttons {
      display: flex;
      gap: 0.8em;
      margin-top: 0.8em;
    }
    @media (max-width: 600px) {
      .glossary-controls {
        flex-direction: column;
        gap: 1em;
      }
      .glossary-control-group {
        width: 100%;
        min-width: 0;
      }
      #course-select, #search-bar {
        min-width: 0;
        width: 100%;
      }
    }
    .glossary-table th, .glossary-table td { text-align: left; padding: 4px 8px; }
    .glossary-table { border-collapse: collapse; }
    .glossary-table th { background: #f1f1f1; }
    .glossary-table td, .glossary-table th { border: 1px solid #ccc; }
    #glossary-table {
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
    }
    .glossary-table {
      min-width: 600px;
      width: max-content;
    }
  </style>
  <script>
    window.MathJax = {

// ---- 2. Get all course columns (excluding Symbol and Name) ----
const allColumns = Object.keys(glossaryData[0] || {});
const baseCols = ["Symbol", "Name"];
const courseCols = allColumns.filter(c => !baseCols.includes(c));

// ---- 3. UI Setup ----
const courseSelect = document.getElementById("course-select");
function updateCourseSelectBehavior(e) {
  const selectedOptions = Array.from(courseSelect.selectedOptions).map(opt => opt.value);
  const allCombined = "All combined";
  const allSeparate = "All separate";
  let changed = false;

  if (selectedOptions.includes(allCombined) && selectedOptions.length > 1) {
    Array.from(courseSelect.options).forEach(opt => {
      if (opt.value !== allCombined) opt.selected = false;
    });
    changed = true;
  } else if (selectedOptions.includes(allSeparate) && selectedOptions.length > 1) {
    Array.from(courseSelect.options).forEach(opt => {
      if (opt.value !== allSeparate) opt.selected = false;
    });
    changed = true;
  } else if (
    selectedOptions.some(v => v !== allCombined && v !== allSeparate) &&
    (selectedOptions.includes(allCombined) || selectedOptions.includes(allSeparate))
  ) {
    Array.from(courseSelect.options).forEach(opt => {
      if (opt.value === allCombined || opt.value === allSeparate) opt.selected = false;
    });
    changed = true;
  }

  if (changed) {
    renderGlossary();
    return;
  }
}
const searchBar = document.getElementById("search-bar");
const tableDiv = document.getElementById("glossary-table");

// Multi-select options
const options = [];
options.push("All combined");
options.push("All separate");
courseCols.forEach(c => options.push(c));
courseSelect.innerHTML = options.map(opt =>
  `<option value="${opt}"${opt === "All separate" ? ' selected' : ''}>${opt}</option>`
).join("");

// ---- 4. Data helpers ----
function combineAndDedup(row, courses) {
  const seen = new Set();
  let result = [];
  for (let col of courses) {
    let val = row[col];
    if (!val) continue;
    for (let entry of val.split(',')) {
      let entryStripped = entry.trim();
      let entryNorm = entryStripped.toLowerCase();
      if (entryNorm && !seen.has(entryNorm)) {
        seen.add(entryNorm);
        result.push(entryStripped);
      }
    }
  }
  result = result.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  if (result.length) {
    result[0] = result[0][0].toUpperCase() + result[0].slice(1);
    for (let i=1; i<result.length; ++i)
      result[i] = result[i].toLowerCase();
  }
  return result.join(', ');
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

// ---- 5. Main render function ----
function renderGlossary() {
  const selected = Array.from(courseSelect.selectedOptions).map(o => o.value);
  const searchQuery = searchBar.value.trim().toLowerCase();

  let headers, rows, activeCourseCols = [];

  if (selected.includes("All combined")) {
    // Only use courses with at least one non-empty value
    activeCourseCols = courseCols.filter(col =>
      glossaryData.some(row => row[col] && row[col].toString().trim() !== "")
    );
    headers = [...baseCols, "All combined"];
    rows = glossaryData.map(row => {
      const combined = combineAndDedup(row, activeCourseCols);
      return [row.Symbol, row.Name, combined];
    }).filter(row =>
      (row[2] && row[2].toString().trim() !== "") &&
      (!searchQuery || row.some(cell => (cell||'').toString().toLowerCase().includes(searchQuery)))
    );
  } else {
    // "All separate" or custom selected
    let displayCourses;
    if (selected.includes("All separate")) {
      displayCourses = [...courseCols];
    } else {
      displayCourses = selected.filter(opt => courseCols.includes(opt));
    }

    // Only show course columns that have at least one non-empty cell in any row
    if (searchQuery) {
      activeCourseCols = displayCourses.filter(col =>
        glossaryData.some(row =>
          row[col] &&
          row[col].toString().trim() !== "" &&
          row[col].toString().toLowerCase().includes(searchQuery)
        )
      );
    } else {
      activeCourseCols = displayCourses.filter(col =>
        glossaryData.some(row => row[col] && row[col].toString().trim() !== "")
      );
    }

    // Only show rows where at least one active course column is non-empty
    rows = glossaryData.filter(row =>
      activeCourseCols.some(col => row[col] && row[col].toString().trim() !== "")
    ).map(row => {
      const baseRow = [row.Symbol || "", row.Name || ""];
      const dataRow = activeCourseCols.map(c => row[c] || "");
      // Row is visible if Symbol, Name, or any displayed course cell matches search
      const rowMatches = (
        (!searchQuery) ||
        (row.Symbol && row.Symbol.toString().toLowerCase().includes(searchQuery)) ||
        (row.Name && row.Name.toString().toLowerCase().includes(searchQuery)) ||
        dataRow.some(cell => (cell||"").toString().toLowerCase().includes(searchQuery))
      );
      if (!rowMatches) return null;
      return [...baseRow, ...dataRow];
    }).filter(Boolean);

    headers = [...baseCols, ...activeCourseCols];
  }

  // Make activeCourseCols available globally for export
  window.activeCourseCols = activeCourseCols || [];

  if (headers.length === baseCols.length || !rows || rows.length === 0) {
    tableDiv.innerHTML = `<em>No results found.</em>`;
    sendHeightToParent();
    return;
  }

  // Render table
  let html = "<table class='glossary-table'><thead><tr>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr></thead><tbody>";
  rows.forEach(r => {
    html += "<tr>";
    r.forEach(cell => html += `<td>${highlight(cell || "", searchQuery)}</td>`);
    html += "</tr>";
  });
  html += "</tbody></table>";
  tableDiv.innerHTML = html;
  if (window.MathJax && window.MathJax.typeset) { MathJax.typeset(); }
  sendHeightToParent();
}

// ---- 6. Export as CSV and PDF ----
function getExportCourseCode() {
  // Get the current selection options (by value, not label)
  const selected = Array.from(document.getElementById("course-select").selectedOptions).map(o => o.value);
  if (selected.length === 1) {
    if (selected[0] === "All combined") return "all_com";
    if (selected[0] === "All separate") return "all_sep";
  }
  if (window.activeCourseCols && window.activeCourseCols.length) {
    if (window.activeCourseCols.length > 3) {
      return "multiple";
    } else {
      return window.activeCourseCols.map(c => c.slice(0, 3)).join('_').toLowerCase();
    }
  } else {
    return "all";
  }
}

function getExportCourseTitle() {
  // Get the current selection options (by value, not label)
  const selected = Array.from(document.getElementById("course-select").selectedOptions).map(o => o.value);
  if (selected.length === 1) {
    if (selected[0] === "All combined") return "Greek Glossary of courses: all combined";
    if (selected[0] === "All separate") return "Greek Glossary of courses: all separate";
  }
  if (window.activeCourseCols && window.activeCourseCols.length) {
    if (window.activeCourseCols.length > 3) {
      return "Greek Glossary of courses: multiple";
    } else {
      return "Greek Glossary of courses: " + window.activeCourseCols.join(', ');
    }
  } else {
    return "Greek Glossary of courses: all";
  }
}

document.getElementById("export-csv").addEventListener("click", function() {
  const table = document.querySelector(".glossary-table");
  if (!table) return;
  let csv = "";
  const ths = table.querySelectorAll("thead th");
  csv += Array.from(ths).map(th => `"${(th.innerText||"").replace(/"/g,'""')}"`).join(",") + "\n";
  const trs = table.querySelectorAll("tbody tr");
  trs.forEach(tr => {
    const tds = tr.querySelectorAll("td");
    csv += Array.from(tds).map(td => `"${(td.innerText||"").replace(/"/g,'""')}"`).join(",") + "\n";
  });
  const blob = new Blob([csv], {type: "text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `greek_glossary_${getExportCourseCode()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("export-pdf").addEventListener("click", function() {
  const table = document.querySelector(".glossary-table");
  if (!table) return;
  html2canvas(table, {scale: 2}).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const pdf = new window.jspdf.jsPDF({
      orientation: 'landscape',
      unit: 'pt',
      format: 'a4'
    });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();

    // Title settings
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(12);
    const title = getExportCourseTitle();
    const textWidth = pdf.getTextWidth(title);
    const x = (pageWidth - textWidth) / 2;
    const titleHeight = 36; // Y position for the title
    pdf.text(title, x, titleHeight);

    // Calculate available space for image
    const yStart = 50; // Leave some space for the title
    const availableWidth = pageWidth - 40;
    const availableHeight = pageHeight - yStart - 20;

    // Calculate scale to fit both width and height
    const scale = Math.min(
      availableWidth / canvas.width,
      availableHeight / canvas.height
    );
    const imgWidth = canvas.width * scale;
    const imgHeight = canvas.height * scale;

    // Center image horizontally if needed
    const imgX = 20 + (availableWidth - imgWidth) / 2;

    pdf.addImage(imgData, 'PNG', imgX, yStart, imgWidth, imgHeight);

    pdf.save(`greek_glossary_${getExportCourseCode()}.pdf`);
  });
});

// ---- 7. Auto-height resize for iframe embedding ----
function sendHeightToParent() {
  if (window.parent !== window) {
    var extraPadding = 20;
    var newHeight = document.body.scrollHeight + extraPadding;
    window.parent.postMessage({
      type: 'setHeight',
      glossaryId: 'greek',
      height: newHeight
    }, '*');
  }
}

// ---- 8. Attach event listeners ----
courseSelect.addEventListener("change", function(e) {
  updateCourseSelectBehavior(e);
  renderGlossary();
});
searchBar.addEventListener("input", renderGlossary);
window.addEventListener("DOMContentLoaded", function() {
  renderGlossary();
  sendHeightToParent();
});
document.getElementById("clear-search").addEventListener("click", function() {
  searchBar.value = "";
  renderGlossary();
  searchBar.focus();
});
</script>
